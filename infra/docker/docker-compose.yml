services:
  postgres:
    image: postgres:16-alpine
    container_name: cerotres-postgres
    restart: unless-stopped
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: cerotres
      POSTGRES_PASSWORD: cerotres
      POSTGRES_DB: cerotres
    volumes:
      - cerotres_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cerotres -d cerotres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cerotres_pg_data:
